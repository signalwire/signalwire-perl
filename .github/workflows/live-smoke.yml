name: Live smoke (real server, nightly, opt-in)

# Plan a-bar 6.5 — the only lane that catches mock<->production drift the
# AUTHORITATIVE_SPEC_SOURCING program hasn't closed yet: it exercises the SDK
# against the REAL SignalWire platform (auth + one REST list + one SWML render +
# one RELAY connect — t/live/smoke.t).
#
# Creds-gated and opt-in: it runs only when the SIGNALWIRE_* secrets are present
# (a fork / secret-less run skips the whole job), and the test itself further
# gates on SWSDK_LIVE_TESTS=1 + the three env vars, so it can never fail for lack
# of credentials — it just skips.

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch: {}

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Gate the whole job on the secret being configured. `secrets` can't be used in
  # a job-level `if:`, so surface presence via a guard job output.
  guard:
    runs-on: ubuntu-latest
    outputs:
      have_creds: ${{ steps.check.outputs.have_creds }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.SIGNALWIRE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "have_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SIGNALWIRE_API_TOKEN secret not configured — skipping live smoke."
          fi

  live:
    needs: guard
    if: needs.guard.outputs.have_creds == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout signalwire-perl
        uses: actions/checkout@v7
        with:
          path: signalwire-perl

      - name: Checkout porting-sdk (test harness modules on @INC path)
        uses: actions/checkout@v7
        with:
          repository: signalwire/porting-sdk
          # PINNED to wave/1-aplus: this branch's gates diff against the wave/1-aplus
          # oracle + register the new PSDK BEHAVIORAL rules (PAGINATION-CORPUS etc.) that
          # main's porting-sdk rejects. REVERT this ref to main when porting-sdk
          # wave/1-aplus merges.
          ref: main
          path: porting-sdk
          token: ${{ secrets.PORTING_SDK_TOKEN }}

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'

      - name: Install Perl dependencies
        working-directory: signalwire-perl
        run: cpanm --notest --quiet --installdeps .

      - name: Run the live smoke (real server)
        working-directory: signalwire-perl
        env:
          SWSDK_LIVE_TESTS: '1'
          SIGNALWIRE_PROJECT_ID: ${{ secrets.SIGNALWIRE_PROJECT_ID }}
          SIGNALWIRE_API_TOKEN: ${{ secrets.SIGNALWIRE_API_TOKEN }}
          SIGNALWIRE_SPACE: ${{ secrets.SIGNALWIRE_SPACE }}
        run: perl -Ilib -It/lib t/live/smoke.t
