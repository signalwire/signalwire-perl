name: Surface Audit (Layer B)

# Layer B symbol-level surface audit — enumerates the Perl SDK's public API
# (packages, public subs) and diffs it against the porting-sdk's reference
# python_surface.json. Any unexcused drift (missing or extra symbol) fails
# the build. Deliberate non-implementations go in PORT_OMISSIONS.md and
# port-only extensions go in PORT_ADDITIONS.md.
#
# See CHECKLIST_TEMPLATE.md § Symbol-level surface parity in
# https://github.com/signalwire/porting-sdk for the contract.

env:
  # Opt into Node.js 24 ahead of GitHub's 2026-06-02 default switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'scripts/enumerate_surface.pl'
      - 'PORT_OMISSIONS.md'
      - 'PORT_ADDITIONS.md'
      - '.github/workflows/surface-audit.yml'
      - 'cpanfile'
  push:
    branches: [main]
  schedule:
    # Nightly at 06:30 UTC to catch drift from upstream Python reference
    # updates that land in porting-sdk between our PRs.
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Perl SDK
        uses: actions/checkout@v7

      - name: Checkout porting-sdk (reference)
        uses: actions/checkout@v7
        with:
          repository: signalwire/porting-sdk
          # Coordinated-pass pin: 'main' normally; set the PORTING_SDK_REF repo variable
          # to a wave branch to test a coordinated porting-sdk change, declared on the PR
          # (see porting-sdk/COORDINATED_PASS.md). No revert commit.
          ref: ${{ vars.PORTING_SDK_REF || 'main' }}
          path: porting-sdk
          fetch-depth: 1
          token: ${{ secrets.PORTING_SDK_TOKEN }}

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      # Install the porting-sdk gate scripts' declared dependencies. NOT optional: the
      # enumerator reaches the reference oracle through generate_rest.py, which needs
      # PyYAML, and a bare `except Exception: return None` turned its absence into an EMPTY
      # oracle — 266 oracle-gated members silently failed to emit and the diff reported
      # "311 Python symbol(s) missing from port", blaming a port that was correct. A dev box
      # has PyYAML, so the failure is CI-only by construction. One manifest, shared by all
      # ten repos; check_script_deps.py fails if a script imports something it omits.
      - name: Install porting-sdk script dependencies
        run: python3 -m pip install --quiet -r ${{ github.workspace }}/porting-sdk/scripts/requirements.txt


      - name: Install Perl dependencies
        run: cpanm --notest --quiet --installdeps .

      - name: Enumerate Perl surface
        # PORTING_SDK is load-bearing: this workflow checks porting-sdk out INSIDE
        # the repo (path: porting-sdk), so the enumerator's sibling-layout search
        # does not find it. Without the oracle every oracle-gated `has` accessor
        # silently fails to emit (387 members) — the enumerator now fails loud on
        # a miss, but set the var so it never has to.
        env:
          PORTING_SDK: ${{ github.workspace }}/porting-sdk
        run: perl scripts/enumerate_surface.pl --output port_surface.json

      - name: Sanity check — port_surface.json was written
        run: |
          test -s port_surface.json
          python3 -c "import json; d=json.load(open('port_surface.json')); assert d['version']=='1'; print('modules:', len(d['modules']))"

      - name: Diff against Python reference
        run: |
          python3 porting-sdk/scripts/diff_port_surface.py \
            --reference porting-sdk/python_surface.json \
            --port-surface port_surface.json \
            --omissions PORT_OMISSIONS.md \
            --additions PORT_ADDITIONS.md

      - name: Run Perl test suite (surface audit smoke tests)
        run: PERL5LIB="lib:t/lib" prove -r t/53_surface_audit.t

      - name: Upload surface snapshot on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: port-surface-${{ github.sha }}
          path: port_surface.json
          retention-days: 14
