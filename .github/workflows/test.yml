name: Test

# Runs the full per-port CI gate set via scripts/run-ci.sh:
#   TEST → SIGNATURES → DRIFT → SURFACE-FRESH → NO-CHEAT → EMISSION
# Mirrors `bash scripts/run-ci.sh` exactly so there's no drift between local
# and CI behavior. Until now the Perl port had no Test workflow at all — the
# language test suite and the EMISSION / NO-CHEAT gates ran nowhere in CI
# (only surface-audit.yml / doc-audit.yml ran, covering surface + docs). This
# closes that hole: a behavioral-emission regression (wrong to_dict() shape
# from bin/emit-corpus.pl) can no longer land green.

env:
  # Opt into Node.js 24 ahead of GitHub's 2026-06-02 default switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test the declared floor (5.36 — where subroutine signatures became a
        # stable, warning-free feature, per cpanfile/Makefile.PL MIN_PERL_VERSION)
        # AND a current release, so the version we *claim* to support is actually
        # exercised. Each matrix entry runs on its own runner, so the per-test
        # mock servers don't contend across versions. fail-fast off so one
        # version's failure still reports the other's result.
        perl: ['5.36', '5.38']
    steps:
      - name: Checkout signalwire-perl
        uses: actions/checkout@v7
        with:
          path: signalwire-perl

      - name: Checkout porting-sdk (mock servers + audit scripts + EMISSION corpus)
        uses: actions/checkout@v7
        with:
          repository: signalwire/porting-sdk
          # Coordinated-pass pin: 'main' normally; set the PORTING_SDK_REF repo variable
          # to a wave branch to test a coordinated porting-sdk change, declared on the PR
          # (see porting-sdk/COORDINATED_PASS.md). No revert commit.
          ref: ${{ vars.PORTING_SDK_REF || 'main' }}
          path: porting-sdk
          token: ${{ secrets.PORTING_SDK_TOKEN }}

      # The EMISSION gate compares this port's to_dict() output (bin/emit-corpus.pl)
      # against the signalwire-python oracle (FunctionResult), which pulls fastapi
      # via signalwire/__init__. Check it out as a sibling so the gate has its
      # reference.
      - name: Checkout signalwire-python (EMISSION oracle)
        uses: actions/checkout@v7
        with:
          repository: signalwire/signalwire-python
          path: signalwire-python
          # PINNED to wave/1-aplus: the reference SDK carrying PY-7 request_options +
          # the new paginator/relay behavior this PR mirrors. REVERT to main when the
          # python wave/1-aplus work merges.
          ref: ${{ vars.PORTING_SDK_REF || 'main' }}

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Setup Python (porting-sdk audit scripts + mock servers)
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Perl dependencies
        working-directory: signalwire-perl
        # --with-develop so the cpanfile's `on 'develop'` block (Perl::Tidy +
        # Perl::Critic) installs — the FMT + LINT gates in run-ci.sh need the
        # perltidy/perlcritic binaries on PATH. Without it the gate fails with
        # `perltidy: command not found`. (doc-audit/surface-audit workflows don't
        # run those gates, so they keep plain --installdeps.)
        run: cpanm --notest --quiet --with-develop --installdeps .

      - name: Install Python test harnesses (mock_relay + mock_signalwire)
        run: |
          pip install -e porting-sdk/test_harness/mock_relay
          pip install -e porting-sdk/test_harness/mock_signalwire

      - name: Install signalwire-python (EMISSION oracle) if not importable
        run: |
          if python -c "import signalwire.core.function_result" 2>/dev/null; then
            echo "signalwire-python already importable; skipping install"
          else
            pip install ./signalwire-python
          fi

      - name: Select gate tier (promote to nightly if PR touches docs/examples)
        id: tier
        working-directory: signalwire-perl
        run: |
          tier=pr
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            if git fetch --no-tags --depth=1 origin "$base" 2>/dev/null \
               && git diff --name-only "$base"...HEAD 2>/dev/null \
                  | grep -qE '^(docs/|examples/|README|.*\.md$)'; then
              tier=nightly
              echo "PR touches docs/examples -> running heavy doc gates (tier=nightly)"
            fi
          fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"

      - name: Run CI gate script (TEST → SIGNATURES → DRIFT → SURFACE-FRESH → NO-CHEAT → EMISSION)
        working-directory: signalwire-perl
        env:
          PORTING_SDK: ${{ github.workspace }}/porting-sdk
          SW_CI_TIER: ${{ steps.tier.outputs.tier }}
          # COORDINATED-PASS reads the live PR body/labels via 'gh api' to see a
          # 'Coordinated-With:' declaration edited after the triggering push.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/run-ci.sh
